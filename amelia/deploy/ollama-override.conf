# /etc/systemd/system/ollama.service.d/override.conf
# Настройки под маленькую машину, которая работает круглосуточно.
[Service]
# Держать модель в памяти: на слабом CPU перезагрузка весит секунды,
# а Амелия дёргает модель редко и неравномерно.
Environment="OLLAMA_KEEP_ALIVE=-1"
# Одна модель за раз — иначе на 8-16 ГБ начнётся своп
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
# Только локально: наружу торчать незачем
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Ограничить потоки, чтобы генерация не съедала машину целиком
Environment="OLLAMA_NUM_THREADS=4"
Restart=always
RestartSec=5
